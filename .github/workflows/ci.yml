name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # A lockfile must exist and install reproducibly: `npm ci` fails otherwise.
      - name: Install
        run: npm ci

      # Gate production dependency advisories; review dev-tool advisories separately.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: PRD contract
        run: npm run test:prd

      # DEVAPI-001: the published OpenAPI document must not drift from the routes.
      - name: OpenAPI contract
        run: npm run test:api

      # The privacy policy, terms and DPA are published by the API, so they are checked like code.
      - name: Legal pack
        run: npm run test:legal

      - name: Backup and restore tool tests
        run: npm run test:backup

      - name: Test Jest failure reporting
        run: node --test scripts/report-jest-failures.test.mjs

      - name: Tests
        run: |
          set +e
          npm test -- --ci --reporters=default --json --outputFile=/tmp/idcp-jest-results.json
          status=$?
          if [ "$status" -ne 0 ]; then
            node scripts/report-jest-failures.mjs /tmp/idcp-jest-results.json
          fi
          exit "$status"

      - name: Build renderer
        run: npm run build --workspace @idcp/desktop

  e2e:
    name: Browser end-to-end journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise renderer and backend
        run: npm run test:e2e

  postgres:
    name: PostgreSQL integration (Node 22)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: idcp
          POSTGRES_PASSWORD: idcp
          POSTGRES_DB: idcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idcp -d idcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://idcp:idcp@localhost:5432/idcp_test
      DATABASE_POOL_SIZE: '4'
      IDCP_TEST_DB_POOL_SIZE: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Run the complete backend suite against PostgreSQL
        run: |
          set +e
          npm run test:postgres -- --reporters=default --json --outputFile=/tmp/idcp-postgres-jest-results.json
          status=$?
          if [ "$status" -ne 0 ]; then
            node scripts/report-jest-failures.mjs /tmp/idcp-postgres-jest-results.json
          fi
          exit "$status"

  container:
    name: Backend container build and Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.compose.example config --quiet

      - name: Build and smoke-test the PostgreSQL deployment stack
        run: |
          set -euo pipefail
          env_file=.env.compose.example
          export POSTGRES_PASSWORD='ci-compose-smoke-postgres-password'
          export JWT_SECRET='ci-compose-smoke-jwt-secret-with-at-least-32-characters'
          export ENCRYPTION_KEY='ci-compose-smoke-encryption-key-with-at-least-32-chars'
          cleanup() {
            docker compose --env-file "$env_file" down --volumes --remove-orphans
          }
          trap cleanup EXIT
          if ! docker compose --env-file "$env_file" up --build --detach 2>&1 | tee /tmp/compose-build.log; then
            docker compose --env-file "$env_file" logs --no-color || true
            # Keep the end of the build output visible as annotations when the job fails.
            tail -n 12 /tmp/compose-build.log | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 http://127.0.0.1:4000/api/v1/health 2>&1 | tee /tmp/compose-health.log; then
            docker compose --env-file "$env_file" logs --no-color | tee /tmp/compose-services.log
            echo '::error::Compose health check failed; see service logs.'
            cat /tmp/compose-health.log | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            tail -n 20 /tmp/compose-services.log | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi
          node scripts/connector-compose-smoke.mjs
          # Disposable CI stack only: stop the API before exercising the packaged offline tool.
          docker compose --env-file "$env_file" stop api
          docker compose --env-file "$env_file" run --rm --no-deps api node dist/export-inventory.js --list --confirm-offline

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on .env files or key material
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.p12$|\.key$|id_rsa'; then
            echo "::error::Secret material is committed to the repository."
            exit 1
          fi
          echo "No secret files tracked."
