openapi: 3.1.0
info:
  title: IDCP API
  version: 1.0.0
  description: |
    The Universal Data Capture Platform API (API.md).

    Every request is scoped to the authenticated actor's organisation: a document, review,
    export, connector or key belonging to another organisation is indistinguishable from one that
    does not exist (404). Errors always use the envelope
    `{ "error": { "code", "message", "details?", "requestId" } }` and the `code` is stable.

    Authentication accepts exactly one of:
      * `Authorization: Bearer <access token>` — a signed-in person
      * `X-Device-Credential: <credential>` — a paired device acting for its owner
      * `X-API-Key: <key>` — a machine client, limited to the key's scopes (DEVAPI-001)
servers:
  - url: /api/v1
    description: This deployment
tags:
  - name: Health
  - name: Auth
  - name: Pairing
  - name: Documents
  - name: Review
  - name: Exports
  - name: Connectors
  - name: Templates
  - name: Organisation
  - name: Projects
  - name: Batches
  - name: Realtime
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token from /auth/login or /auth/register (15 minutes).
    deviceCredential:
      type: apiKey
      in: header
      name: X-Device-Credential
      description: Opaque credential issued once by /pairing/complete.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Developer API key (DEVAPI-001). Scopes map to the role ladder.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [UNAUTHENTICATED, FIELD_VALIDATION_FAILED, NOT_FOUND]
            message:
              type: string
            details: {}
            requestId:
              type: string
    User:
      type: object
      required: [id, email, displayName, role, organisationId, organisationName]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [viewer, operator, reviewer, admin, owner] }
        organisationId: { type: string }
        organisationName: { type: string }
        terms:
          type: object
          description: >-
            Present on `GET /auth/me`. The acceptance record, so a contract can be proved and a
            revised pack can be re-presented (DEC-032).
          required: [acceptedAt, version, current]
          properties:
            acceptedAt: { type: string, format: date-time, nullable: true }
            version: { type: string, nullable: true }
            current:
              type: boolean
              description: False when nothing was accepted, or when the pack has been revised since.
    TokenPair:
      type: object
      required: [accessToken, expiresIn, refreshToken, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Document:
      type: object
      required: [id, status, documentType, mimeType, sizeBytes, pageCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [queued, uploaded, processing, extracted, needs_review, approved, failed, deleted]
        documentType:
          type: string
          enum: [form, receipt, invoice, id, contract, table, handwritten, unknown]
        mimeType: { type: string }
        sizeBytes: { type: integer }
        pageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MfaChallenge:
      type: object
      description: Returned by `POST /auth/login` instead of a session when a second factor is due.
      required: [mfaRequired, challengeToken, expiresInSeconds]
      properties:
        mfaRequired: { type: boolean, const: true }
        challengeToken: { type: string }
        expiresInSeconds: { type: integer, example: 300 }
    Udm:
      type: object
      description: Universal Data Model record (UDM-001). See docs/udm-1.0.schema.json.
      required:
        [udmVersion, documentType, documentTypeConfidence, source, fields, tables, extractedAt]
      properties:
        udmVersion: { type: string }
        documentType: { type: string }
        documentTypeConfidence: { type: number, minimum: 0, maximum: 1 }
        source: { type: object }
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              label: { type: string }
              value: {}
              type: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              needsReview: { type: boolean }
              corrected: { type: boolean }
        tables: { type: array, items: { type: object } }
        needsReview: { type: boolean }
        extractedAt: { type: string, format: date-time }
    BlockingField:
      type: object
      required: [path, reason, confidence]
      properties:
        path: { type: string }
        reason: { type: string, enum: [low_confidence, missing_value, not_found, not_processed] }
        confidence: { type: number }
    Template:
      type: object
      required: [id, name, documentType, fields, version, active]
      properties:
        id: { type: string }
        name: { type: string }
        documentType: { type: string }
        fields: { type: array, items: { type: object } }
        version: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
paths:
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password-reset link
      description: >-
        Always answers 202 with the same body, whether or not the address exists. Outside production
        the response also carries `resetUrl`, because this deployment has no mail transport (DEC-030).
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean, const: true }
                  resetUrl: { type: string, format: uri }
        '429': { description: Too many requests }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Finish a password reset with a single-use token
      description: Revokes every session for the account when it succeeds.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        '204': { description: Password changed }
        '400': { description: Password too weak }
        '401': { description: Invalid, used or expired token }
  /auth/password/change:
    post:
      tags: [Auth]
      summary: Change the password of the signed-in user
      description: >-
        Other sessions are revoked. Send the caller's own `refreshToken` to keep that session alive.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
                refreshToken: { type: string }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  revokedSessions: { type: integer }
        '400': { description: New password rejected }
        '401': { description: Current password incorrect }
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List live sessions for the signed-in user
      operationId: listSessions
      parameters:
        - name: current
          in: query
          required: false
          schema: { type: string }
          description: The caller's own session id, so it can be marked as current.
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        userAgent: { type: string, nullable: true }
                        current: { type: boolean }
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's own sessions
      operationId: revokeSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '404': { description: Not your session, or already revoked }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Sign out everywhere
      operationId: logoutAll
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revokedSessions: { type: integer }
  /legal:
    get:
      tags: [Legal]
      summary: List the published legal documents
      operationId: listLegalDocuments
      security: []
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        url: { type: string }
  /legal/{slug}:
    get:
      tags: [Legal]
      summary: Fetch a legal document as plain text
      operationId: getLegalDocument
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [privacy, terms, dpa, subprocessors, security]
      responses:
        '200':
          description: Markdown document served as text/plain
          content:
            text/plain:
              schema: { type: string }
        '404': { description: No such document }
  /me/export:
    get:
      tags: [Privacy]
      summary: Download everything held about the signed-in person
      description: Data-subject access and portability, as a JSON attachment.
      operationId: exportMyData
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  formatVersion: { type: integer, const: 1 }
                  account:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      displayName: { type: string }
                      locale: { type: string }
                      createdAt: { type: string, format: date-time }
                      lastLoginAt: { type: string, nullable: true }
                  organisations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        role: { type: string }
                        joinedAt: { type: string, format: date-time }
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        documentType: { type: string }
                        mimeType: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
                  reviews:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        documentId: { type: string }
                        status: { type: string }
                        createdAt: { type: string, format: date-time }
                  auditEntries:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string }
                        targetType: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                  notes:
                    type: array
                    items: { type: string }
  /me/erase:
    post:
      tags: [Privacy]
      summary: Erase (anonymise) the signed-in account
      description: >-
        Requires the account password and the literal word DELETE. Refused with 409 while the person
        is one of several owners; a sole owner erases the organisation's identity with them.
      operationId: eraseAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string }
                confirm: { type: string, const: DELETE }
      responses:
        '200':
          description: Account anonymised and draft files removed
          content:
            application/json:
              schema: &EraseAccountResult
                type: object
                required:
                  [erased, anonymisedAt, fileDeletionStatus, pendingFileCount, retainedRecords]
                properties:
                  erased:
                    { type: boolean, const: true, description: Account anonymisation completed }
                  anonymisedAt: { type: string, format: date-time }
                  fileDeletionStatus: { type: string, enum: [complete, pending] }
                  pendingFileCount:
                    {
                      type: [integer, 'null'],
                      minimum: 0,
                      description: Null when the count could not be determined,
                    }
                  retainedRecords: { type: string }
        '202':
          description: Account anonymised; one or more draft files are pending deletion and will be retried
          content:
            application/json:
              schema: *EraseAccountResult
        '400': { description: Confirmation missing }
        '401': { description: Wrong password }
        '409': { description: Still one of several owners }
        '429': { description: Too many attempts }
  /health:
    get:
      tags: [Health]
      summary: Liveness and dependency status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  version: { type: string }
                  uptimeSeconds: { type: integer }
                  dependencies: { type: object }
        '503': { description: A dependency is down }
  /auth/register:
    post:
      tags: [Auth]
      summary: Create the first account and its organisation
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName, organisationName, acceptTerms]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 256 }
                displayName: { type: string, maxLength: 120 }
                organisationName: { type: string, maxLength: 120 }
                acceptTerms:
                  type: boolean
                  const: true
                  description: >-
                    The sign-up checkbox. Must be `true`; the version that was accepted is recorded
                    server-side, not sent by the client (DEC-032).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          {
            description: Invalid input,
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '409': { description: Email already registered }
  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: >-
            A session, or — when the account has a second factor — a five-minute challenge that must
            be exchanged at `POST /auth/mfa/verify` (DEC-034). Discriminate on `mfaRequired`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/TokenPair' }
                  - { $ref: '#/components/schemas/MfaChallenge' }
        '401': { description: Wrong email or password }
        '429': { description: Too many attempts }
  /auth/mfa:
    get:
      tags: [Auth]
      summary: Whether this account has a second factor
      operationId: getMfaStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, enabledAt, recoveryCodesRemaining]
                properties:
                  enabled: { type: boolean }
                  enabledAt: { type: string, format: date-time, nullable: true }
                  recoveryCodesRemaining: { type: integer, minimum: 0 }
        '401': { description: Not signed in }
  /auth/mfa/enrol:
    post:
      tags: [Auth]
      summary: Start enrolling a TOTP authenticator
      description: >-
        Confirms the password and returns a secret plus an `otpauth://` URI. Nothing is switched on
        until the first code is confirmed, so an abandoned enrolment cannot lock anyone out.
      operationId: startMfaEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Secret to add to the authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri, issuer, account]
                properties:
                  secret: { type: string }
                  otpauthUri: { type: string }
                  issuer: { type: string }
                  account: { type: string }
        '400': { description: Password missing }
        '401': { description: Password incorrect }
        '409': { description: A second factor is already enabled }
        '429': { description: Too many enrolments }
  /auth/mfa/enrol/confirm:
    post:
      tags: [Auth]
      summary: Confirm enrolment with the first code
      description: Returns the recovery codes exactly once; they are stored only as hashes.
      operationId: confirmMfaEnrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                required: [enabledAt, recoveryCodes]
                properties:
                  enabledAt: { type: string, format: date-time }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400': { description: Malformed code }
        '401': { description: Not signed in }
        '422': { description: Code did not match }
        '429': { description: Too many attempts }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Exchange a login challenge for a session
      description: >-
        Accepts a six-digit code, or one of the recovery codes (which is consumed). Failure counts
        are limited per client address, because the caller is not signed in yet.
      operationId: verifyMfaLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, minLength: 6, maxLength: 40 }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { description: Challenge or code invalid, expired or already used }
        '429': { description: Too many attempts }
  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Turn the second factor off
      description: Requires the password and a live code, so a stolen session alone cannot do it.
      operationId: disableMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, minLength: 6, maxLength: 40 }
      responses:
        '204': { description: Disabled }
        '401': { description: Password or code incorrect }
        '422': { description: Code did not match }
  /auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      summary: Replace the recovery codes
      description: Invalidates every unused code and returns a fresh set, exactly once.
      operationId: regenerateMfaRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: New codes
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '401': { description: Not signed in or code incorrect }
        '409': { description: A second factor is not enabled }
        '422': { description: Code did not match }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New pair (the old refresh token is now invalid)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { description: Refresh token is invalid, expired or already rotated }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Revoked }
  /auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user and their organisation
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Not signed in }
  /auth/terms/accept:
    post:
      tags: [Auth]
      summary: Accept the current legal pack
      description: >-
        For accounts created before the pack existed, or whose pack has since been revised.
        Re-accepting the same version is allowed and refreshes the record (DEC-032).
      operationId: acceptTerms
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [acceptedAt, version, current]
                properties:
                  acceptedAt: { type: string, format: date-time }
                  version: { type: string }
                  current: { type: boolean, const: true }
        '401': { description: Not signed in }
  /pairing/sessions:
    post:
      tags: [Pairing]
      summary: Create a single-use pairing code
      operationId: createPairingSession
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string }
                  endpoint: { type: string }
                  expiresAt: { type: string, format: date-time }
                  expiresInSeconds: { type: integer }
                  qrPayload: { type: string }
  /pairing/sessions/{id}:
    get:
      tags: [Pairing]
      summary: Poll a pairing session for completion
      operationId: getPairingSession
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Session state }
        '404': { description: Not found in this organisation }
  /pairing/complete:
    post:
      tags: [Pairing]
      summary: Exchange a scanned token for a device credential
      operationId: completePairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, device]
              properties:
                token: { type: string }
                device:
                  type: object
                  required: [name, platform]
                  properties:
                    name: { type: string, maxLength: 80 }
                    platform: { type: string, enum: [android, ios, desktop] }
                    appVersion: { type: string }
      responses:
        '201': { description: Device paired }
        '410': { description: Token expired or already used }
  /devices:
    get:
      tags: [Pairing]
      summary: List paired devices
      operationId: listDevices
      responses:
        '200': { description: Devices }
  /devices/{id}:
    patch:
      tags: [Pairing]
      summary: Rename or revoke a device
      operationId: updateDevice
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Pairing]
      summary: Revoke a device
      operationId: revokeDevice
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
  /documents:
    get:
      tags: [Documents]
      summary: List documents (cursor paginated)
      operationId: listDocuments
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: documentType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Page of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  nextCursor: { type: string, nullable: true }
    post:
      tags: [Documents]
      summary: Upload a document (multipart/form-data)
      operationId: uploadDocument
      description: |
        Accepts one JPEG, PNG, HEIC or PDF file. The declared content type is checked against the
        bytes. Send `Idempotency-Key` (8–100 chars) so a retry never creates a second document.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                documentType: { type: string }
      responses:
        '201': { description: Accepted and queued }
        '200': { description: Duplicate upload (same idempotency key) }
        '413': { description: File too large }
        '415': { description: Unsupported content type }
  /documents/{id}:
    get:
      tags: [Documents]
      summary: One document
      operationId: getDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '404': { description: Not found in this organisation }
    delete:
      tags: [Documents]
      summary: Delete a document and its stored file
      operationId: deleteDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
  /documents/{id}/file:
    get:
      tags: [Documents]
      summary: The original file (authenticated, never a public URL)
      operationId: getDocumentFile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
  /documents/{id}/result:
    get:
      tags: [Documents]
      summary: The latest extraction for a document
      operationId: getDocumentResult
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Document and its latest UDM (or null while queued)
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  extraction:
                    oneOf:
                      - type: 'null'
                      - type: object
                        properties:
                          id: { type: string }
                          udm: { $ref: '#/components/schemas/Udm' }
                          needsReview: { type: boolean }
                          confidence: { type: number }
  /documents/{id}/reprocess:
    post:
      tags: [Documents]
      summary: Queue the document for extraction again
      operationId: reprocessDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Queued }
        '404': { description: Document not found or deleted }
        '409': { description: An extraction is already queued or running }
  /documents/{id}/review:
    post:
      tags: [Review]
      summary: Open (or resume) the review for a document
      operationId: openReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Review session with the UDM and blocking fields }
        '409': { description: Document is not available for review or has active extraction work }
  /documents/{id}/duplicates:
    get:
      tags: [Connectors]
      summary: Would this record duplicate an existing destination row? (read-only)
      operationId: checkDuplicates
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: connectorId, in: query, required: true, schema: { type: string } }
        - { name: mappingProfileId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: '`isDuplicate`, `bestScore`, `matchedKeys`, `threshold`, `candidates`'
        '404': { description: Document, connector or mapping profile not found }
  /documents/{id}/send:
    post:
      tags: [Connectors]
      summary: Write an approved record to a destination
      operationId: sendDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId, mappingProfileId]
              properties:
                connectorId: { type: string }
                mappingProfileId: { type: string }
      responses:
        '202': { description: 'Send attempted: succeeded, skipped_duplicate or failed' }
        '409': { description: The record is not approved }
  /review/queue:
    get:
      tags: [Review]
      summary: Records needing a human, least confident first
      operationId: reviewQueue
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Queue with blocking fields per record }
  /review/{id}/fields:
    patch:
      tags: [Review]
      summary: Record corrections (and optionally confirm the document type)
      operationId: patchReviewFields
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                changes:
                  type: array
                  items:
                    type: object
                    required: [fieldPath, value]
                    properties:
                      fieldPath: { type: string }
                      value: {}
                documentType: { type: string }
      responses:
        '200': { description: Applied changes plus the remaining blocking fields }
        '409':
          { description: The review is closed or stale, or the document is unavailable for review }
  /review/{id}/approve:
    post:
      tags: [Review]
      summary: Approve a record (refused while any field is unresolved)
      operationId: approveReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved }
        '409':
          { description: The review is closed or stale, or the document is unavailable for review }
        '422': { description: Unresolved fields, returned in `details` }
  /review/{id}/reject:
    post:
      tags: [Review]
      summary: Reject a record with a reason
      operationId: rejectReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Rejected }
        '409':
          { description: The review is closed or stale, or the document is unavailable for review }
  /workflows:
    get:
      tags: [Workflows]
      summary: Workflow rules for this organisation
      operationId: listWorkflows
      responses:
        '200': { description: '`items[]` with trigger, conditions, actions and approval policy' }
    post:
      tags: [Workflows]
      summary: Create a workflow rule (admin; auto-approval needs an owner)
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger, actions]
              properties:
                name: { type: string }
                trigger:
                  type: string
                  enum:
                    [document.approved, document.extracted, document.needs_review, batch.completed]
                documentType: { type: string, nullable: true }
                conditions:
                  type: array
                  items:
                    type: object
                    required: [field, operator]
                    properties:
                      field: { type: string }
                      operator:
                        type: string
                        enum:
                          [
                            equals,
                            not_equals,
                            contains,
                            starts_with,
                            greater_than,
                            less_than,
                            exists,
                            in,
                          ]
                      value: {}
                actions:
                  type: array
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        {
                          type: string,
                          enum: [send_to_connector, create_export, notify, delete_document],
                        }
                      config: { type: object }
                approvalPolicy: { type: string, enum: [always_ask, auto_approve] }
                enabled: { type: boolean }
      responses:
        '201': { description: The created workflow }
        '403': { description: Admin role required }
  /workflows/{id}:
    patch:
      tags: [Workflows]
      summary: Enable or disable a workflow (admin)
      operationId: setWorkflowEnabled
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': { description: The updated workflow }
        '403': { description: Admin role required }
    delete:
      tags: [Workflows]
      summary: Delete a workflow rule, keeping its run history (admin)
      operationId: deleteWorkflow
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Deleted }
        '403': { description: Admin role required }
  /workflows/runs:
    get:
      tags: [Workflows]
      summary: The workflow run log — what each rule saw and decided
      operationId: listWorkflowRuns
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: '`items[]` with status, explanation, actions, outputs and failure' }
  /workflows/evaluate:
    post:
      tags: [Workflows]
      summary: Evaluate every enabled workflow for a trigger and record the results
      description: Plans containing notify, send_to_connector or create_export do not dispatch and fail without executing actions. Approval-required plans fail on approval instead.
      operationId: evaluateWorkflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trigger]
              properties:
                trigger:
                  type: string
                  enum:
                    [document.approved, document.extracted, document.needs_review, batch.completed]
                documentId: { type: string, format: uuid }
      responses:
        '200': { description: '`plans[]` and the recorded `runs[]`' }
  /workflows/runs/{id}:
    get:
      tags: [Workflows]
      summary: Inspect one tenant-scoped workflow run
      operationId: getWorkflowRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The run, recorded plan, outcome and execution protocol }
        '404': { description: Run not found }
  /workflows/runs/{id}/cancel-interrupted:
    post:
      tags: [Workflows]
      summary: Cancel a reviewed interrupted workflow run without replaying it
      description: Requires a signed-in owner, explicit review and an incident reference. Only consistent matched runs created under execution protocol 1 are eligible. Old binaries and external effects are not fenced.
      operationId: cancelInterruptedWorkflowRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmReviewed, incidentReference]
              properties:
                confirmReviewed: { type: boolean, const: true }
                incidentReference:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 80,
                    pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:@/-]{0,79}$',
                  }
      responses:
        '200': { description: The cancelled run, now failed, and its recorded plan }
        '400': { description: Review confirmation or incident reference is invalid }
        '403': { description: Signed-in owner required }
        '404': { description: Run not found }
        '409': { description: Run is not eligible or was already completed or cancelled }
  /workflows/runs/{id}/approve:
    post:
      tags: [Workflows]
      summary: Approve one pending run and execute its destructive actions
      description: Unavailable notify, send_to_connector and create_export actions cause a 409 and no actions execute. Workflow deletion is soft-delete only; its metadata, run completion and audits commit together for current-version executions.
      operationId: approveWorkflowRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The completed run with its outputs }
        '403': { description: Reviewer role required }
        '409': { description: The run is not awaiting approval, or an action failed }
  /marketplace:
    get:
      tags: [Marketplace]
      summary: The connector catalogue with this organisation's install state
      description: Bundled entries are informational and not installable unless a trusted signed catalogue and public key are configured.
      operationId: listMarketplace
      responses:
        '200':
          { description: '`items[]` with permissions, signatureVerified, installable and blocker' }
  /marketplace/install:
    post:
      tags: [Marketplace]
      summary: Install a signed package onto a connector of the matching type (admin)
      operationId: installPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId, connectorId]
              properties:
                packageId: { type: string }
                connectorId: { type: string, format: uuid }
                version: { type: string, description: Defaults to the newest version offered }
      responses:
        '201': { description: The installation, including the permissions it holds }
        '403': { description: Admin role required }
        '409': { description: Wrong connector type, already installed, unsigned or revoked package }
  /marketplace/installs/{id}/rollback:
    post:
      tags: [Marketplace]
      summary: Roll an installation back to the previously active version (admin)
      operationId: rollbackPackage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: '`rolledBack`, `activeVersion` (null when nothing preceded it), `message`',
          }
        '403': { description: Admin role required }
        '409':
          {
            description: Installation already rolled back or the previous version is no longer trusted,
          }
  /review/corrections:
    get:
      tags: [Review]
      summary: What reviewers keep correcting, by field and document type (aggregates only)
      operationId: correctionStats
      responses:
        '200': { description: '`optIn`, `total`, `byField`, `byDocumentType`' }
  /review/corrections/export:
    post:
      tags: [Review]
      summary: Export corrections for training (admin, requires opt-in)
      operationId: exportCorrections
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '200': { description: Correction rows with document type, field and confidence }
        '403': { description: Admin role required }
        '409': { description: The organisation has not opted in to training use }
  /review/bulk-approve:
    post:
      tags: [Review]
      summary: Approve several records, skipping any with unresolved fields
      operationId: bulkApprove
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              properties:
                documentIds:
                  type: array
                  maxItems: 200
                  items: { type: string }
      responses:
        '200': { description: '`approved` ids and `skipped` ids with reasons' }
  /exports:
    get:
      tags: [Exports]
      summary: Export history
      operationId: listExports
      responses:
        '200': { description: Exports }
    post:
      tags: [Exports]
      summary: Export approved records to Excel or CSV
      operationId: createExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [xlsx, csv] }
                documentType: { type: string }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                delimiter: { type: string, enum: [',', ';', "\t", '|'] }
                columns: { type: array, items: { type: string } }
                bom: { type: boolean }
      responses:
        '201': { description: Export built (ready) or queued }
        '400': { description: Nothing to export, or invalid options }
  /exports/{id}:
    get:
      tags: [Exports]
      summary: One export
      operationId: getExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Export }
  /exports/{id}/download:
    get:
      tags: [Exports]
      summary: Download the generated file
      operationId: downloadExport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: File bytes }
        '404': { description: Missing, expired or deleted }
  /connectors/types:
    get:
      tags: [Connectors]
      summary: Supported connector types and capabilities
      operationId: listConnectorTypes
      responses:
        '200': { description: Types }
  /connectors:
    get:
      tags: [Connectors]
      summary: Configured connectors
      description: Config and credentials are write-only; responses contain an empty config object. Legacy plaintext rows require offline migration; see SECURITY.md and R01 ARC-023.
      operationId: listConnectors
      responses:
        '200': { description: Connectors }
    post:
      tags: [Connectors]
      summary: Add a connector
      description: Config and credentials are encrypted together; credentials override matching config keys and the merged settings are validated. Responses do not return settings.
      operationId: createConnector
      responses:
        '201': { description: Created }
        '400': { description: Configuration rejected by the connector' }
  /connectors/{id}:
    patch:
      tags: [Connectors]
      summary: Update a connector
      description: Config, if provided, replaces the complete configuration; existing credentials are preserved and override matching keys. Credentials cannot currently be changed through PATCH.
      operationId: updateConnector
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Connectors]
      summary: Remove a connector
      operationId: deleteConnector
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }
  /connectors/{id}/test:
    post:
      tags: [Connectors]
      summary: Health check a connector
      operationId: testConnector
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '`ok` plus an actionable message' }
  /connectors/{id}/schema:
    get:
      tags: [Connectors]
      summary: Destination columns the connector can write to
      operationId: getConnectorSchema
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Columns }
  /connectors/{id}/runs:
    get:
      tags: [Connectors]
      summary: Recent send history
      operationId: listConnectorRuns
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Runs }
  /mapping-profiles:
    get:
      tags: [Connectors]
      summary: Saved field mappings
      operationId: listMappingProfiles
      responses:
        '200': { description: Profiles }
    post:
      tags: [Connectors]
      summary: Save a field mapping
      operationId: createMappingProfile
      responses:
        '201': { description: Created }
  /templates:
    get:
      tags: [Templates]
      summary: Document templates
      operationId: listTemplates
      parameters:
        - { name: documentType, in: query, schema: { type: string } }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
    post:
      tags: [Templates]
      summary: Create a template, optionally from a processed document
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, documentType]
              properties:
                name: { type: string }
                documentType: { type: string }
                fields: { type: array, items: { type: object } }
                fromDocumentId: { type: string }
      responses:
        '201': { description: Created at version 1 }
        '400': { description: No fields, or a duplicate field path }
  /templates/{id}:
    get:
      tags: [Templates]
      summary: One template with its version history
      operationId: getTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Template and versions }
        '404': { description: Not found in this organisation }
    patch:
      tags: [Templates]
      summary: Update a template (a field-list change creates a version)
      operationId: updateTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Templates]
      summary: Disable a template without deleting its history
      operationId: disableTemplate
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Disabled }
  /api-keys:
    get:
      tags: [Organisation]
      summary: API keys (secrets are never returned)
      operationId: listApiKeys
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [Organisation]
      summary: Create an API key — the secret is returned once
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - documents:read
                      - documents:write
                      - review:write
                      - exports:read
                      - connectors:write
                      - admin
      responses:
        '201': { description: 'Key created; `key` is present in this response only' }
        '403': { description: Only owners and admins may issue keys }
  /api-keys/{id}:
    delete:
      tags: [Organisation]
      summary: Revoke an API key
      operationId: revokeApiKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Revoked }
  /organisation:
    get:
      tags: [Organisation]
      summary: The current organisation
      operationId: getOrganisation
      responses:
        '200': { description: Organisation }
    patch:
      tags: [Organisation]
      summary: Update name, retention or AI provider (admin)
      operationId: updateOrganisation
      responses:
        '200': { description: Updated }
        '403': { description: Admin role required }
  /users:
    get:
      tags: [Organisation]
      summary: Team members
      operationId: listUsers
      responses:
        '200': { description: Members }
  /users/invite:
    post:
      tags: [Organisation]
      summary: Invite a team member (single-use, expiring)
      operationId: inviteUser
      responses:
        '202': { description: 'Invited; the response carries the single-use accept link once' }
  /users/{id}/role:
    patch:
      tags: [Organisation]
      summary: Change a member's role (takes effect on their next request)
      operationId: changeRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
  /users/{id}:
    delete:
      tags: [Organisation]
      summary: Remove a member
      operationId: removeUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }
  /audit-logs:
    get:
      tags: [Organisation]
      summary: Search the immutable audit trail
      operationId: listAuditLogs
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Audit records }
  /audit-logs.csv:
    get:
      tags: [Organisation]
      summary: The same audit trail as a CSV file
      description: >-
        Admin only, like the JSON endpoint. Up to 5,000 rows, formula-neutralised for spreadsheets,
        and the act of taking the file is itself recorded as `audit.exported`.
      operationId: exportAuditLogs
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: CSV attachment (`audit-log-YYYY-MM-DD.csv`)
          content:
            text/csv:
              schema: { type: string }
        '403': { description: Below admin }
  /stats:
    get:
      tags: [Organisation]
      summary: Dashboard figures — status counts, document types and a daily series
      operationId: getStats
      parameters:
        - name: days
          in: query
          description: Length of the daily series (1–90, default 14).
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: '`documents`, `documentTypes`, `timeline`, `review`, `connectors`, `exports`'
  /stats.csv:
    get:
      tags: [Organisation]
      summary: The same dashboard figures as CSV
      operationId: downloadStatsCsv
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: CSV (UTF-8 with BOM)
          content:
            text/csv:
              schema: { type: string }
  /retention/purge:
    post:
      tags: [Organisation]
      summary: Queue a retention purge (admin)
      operationId: purgeRetention
      responses:
        '202':
          { description: '`jobId` of the queued or already-active purge; not proof of deletion' }
  /projects:
    get:
      tags: [Projects]
      summary: List projects (archived ones only with `includeArchived=true`)
      operationId: listProjects
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Projects }
    post:
      tags: [Projects]
      summary: Create a project (admin)
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                key:
                  {
                    type: string,
                    maxLength: 20,
                    description: Uppercase identifier,
                    derived from the name when omitted,
                  }
      responses:
        '201': { description: Created }
        '409': { description: The key is already in use }
  /projects/{id}:
    patch:
      tags: [Projects]
      summary: Rename, archive or restore a project (admin)
      operationId: updateProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                archived: { type: boolean }
      responses:
        '200': { description: Updated }
        '404': { description: Not found }
    delete:
      tags: [Projects]
      summary: Archive a project (documents keep their assignment)
      operationId: archiveProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Archived }
  /batches:
    get:
      tags: [Batches]
      summary: Recent batches
      operationId: listBatches
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Batches with derived progress }
    post:
      tags: [Batches]
      summary: Upload many files in one request (each file becomes its own document)
      operationId: createBatch
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                projectId: { type: string, format: uuid }
                documentType: { type: string }
                files:
                  type: array
                  maxItems: 100
                  items: { type: string, format: binary }
      responses:
        '201': { description: 'Accepted; per-item results report individual failures' }
        '400': { description: No files, or more than 100 }
  /batches/{id}:
    get:
      tags: [Batches]
      summary: One batch with per-item status
      operationId: getBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Batch }
        '404': { description: Not found }
  /batches/{id}/items:
    get:
      tags: [Batches]
      summary: Progress counters and item statuses (poll while processing)
      operationId: getBatchItems
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '`total`, `processed`, `succeeded`, `failed`, `status`, `items`' }
  /batches/{id}/results.csv:
    get:
      tags: [Batches]
      summary: Per-item results as CSV (UTF-8 with BOM)
      operationId: downloadBatchResults
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /invitations:
    get:
      tags: [Organisation]
      summary: Pending and used invitations (admin)
      operationId: listInvitations
      responses:
        '200': { description: Invitations, without tokens }
  /invitations/{id}:
    delete:
      tags: [Organisation]
      summary: Revoke an invitation (admin)
      operationId: revokeInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
  /invitations/{token}/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation and sign in (single use)
      description: |
        Set a password for a new account, or supply the current password for an existing account.
        If the existing account has MFA enabled, also supply an authenticator or recovery code.
      operationId: acceptInvitation
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12 }
                code:
                  {
                    type: string,
                    minLength: 6,
                    maxLength: 40,
                    description: Authenticator or recovery code when MFA is enabled,
                  }
      responses:
        '200': { description: Token pair, as /auth/login }
        '400': { description: Invalid request or weak password }
        '401': { description: Invalid invitation or credentials }
  /events:
    get:
      tags: [Realtime]
      summary: Server-sent stream of organisation events
      operationId: streamEvents
      description: |
        `EventSource` cannot send headers, so this endpoint also accepts the access token as an
        `access_token` query parameter. Only identifiers are sent, never document content.
      parameters:
        - { name: access_token, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
