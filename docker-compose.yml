name: idcp

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: '4000'
  API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL to the public API URL}
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the application origin}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set allowed origins; include app://idcp for packaged Electron}
  DB_DRIVER: postgres
  DATABASE_URL: 'postgresql://${POSTGRES_USER:-idcp}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a URL-safe random value}@db:5432/${POSTGRES_DB:-idcp}'
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique production secret of at least 32 characters}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a unique production key of at least 32 characters}
  STORAGE_DRIVER: filesystem
  STORAGE_PATH: /data/documents
  LEGAL_DIR: /app/legal
  TESSERACT_BIN: /usr/bin/tesseract
  TRUST_PROXY: ${TRUST_PROXY:-true}
  WORKER_ENABLED: ${WORKER_ENABLED:-true}
  MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idcp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: idcp-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    command: ['node', 'dist/migrate.js']
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    image: idcp-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment: *backend-environment
    ports:
      - '${API_HOST_BIND:-127.0.0.1}:${API_PORT:-4000}:4000'
    volumes:
      - document-data:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  document-data:
